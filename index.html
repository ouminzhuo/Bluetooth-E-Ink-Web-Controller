<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>蓝牙墨水屏 SVG 生成器</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>4.2 寸蓝牙墨水屏 SVG 生成器</h1>
      <p class="subtitle">规格：三色（黑/白/红），默认画布 400×300，可切换横向/竖向并预览 Atkinson 效果。</p>

      <section class="panel controls">
        <h2>文本与版式</h2>
        <label>
          输入文字
          <textarea id="textInput" rows="6" placeholder="输入要显示的文字，支持换行"></textarea>
        </label>

        <div class="grid-2">
          <label>
            展示方向
            <select id="orientation">
              <option value="landscape">横向（400×300）</option>
              <option value="portrait">竖向（300×400）</option>
            </select>
          </label>

          <label>
            文本颜色
            <select id="textColor">
              <option value="#000000">黑色</option>
              <option value="#ff0000">红色</option>
            </select>
          </label>

          <label>
            字号
            <input id="fontSize" type="number" min="12" max="120" value="40" />
          </label>

          <label>
            行高（倍数）
            <input id="lineHeight" type="number" min="1" max="2" step="0.05" value="1.25" />
          </label>

          <label>
            左右边距
            <input id="padding" type="number" min="0" max="80" value="24" />
          </label>

          <label>
            对齐方式
            <select id="textAlign">
              <option value="start">左对齐</option>
              <option value="middle">居中</option>
              <option value="end">右对齐</option>
            </select>
          </label>
        </div>
      </section>

      <section class="panel controls">
        <h2>字体</h2>
        <div class="font-row">
          <label class="grow">
            在线字体
            <select id="onlineFont">
              <option value="Noto Sans SC">Noto Sans SC（推荐）</option>
              <option value="Noto Serif SC">Noto Serif SC</option>
              <option value="ZCOOL KuaiLe">ZCOOL KuaiLe</option>
              <option value="Ma Shan Zheng">Ma Shan Zheng</option>
            </select>
          </label>
          <button id="useOnlineFont" type="button">使用在线字体</button>
        </div>

        <label>
          上传字体文件（.ttf / .otf / .woff / .woff2）
          <input id="fontFile" type="file" accept=".ttf,.otf,.woff,.woff2" />
        </label>
        <p id="fontStatus" class="hint">当前字体：Noto Sans SC</p>
      </section>

      <section class="panel actions">
        <button id="previewBtn" type="button" class="primary">1) 更新预览</button>
        <button id="exportBtn" type="button">2) 确认并导出 SVG</button>
      </section>

      <section class="panel controls">
        <h2>蓝牙发送</h2>
        <p id="bluetoothHint" class="hint"></p>
        <details open>
          <summary>Firefox / Ubuntu 推荐：连接本地蓝牙桥接服务</summary>
          <div class="grid-2 top-space">
            <label>
              WebSocket 地址
              <input id="bridgeUrl" type="text" value="ws://127.0.0.1:8765" />
            </label>
            <label>
              设备 MAC 地址
              <input id="deviceAddress" type="text" placeholder="AA:BB:CC:DD:EE:FF" />
            </label>
            <label>
              Characteristic UUID
              <input id="characteristicUuid" type="text" placeholder="0000ffe1-0000-1000-8000-00805f9b34fb" />
            </label>
            <label>
              分包大小（字节）
              <input id="chunkSize" type="number" min="20" max="512" value="180" />
            </label>
            <label>
              分包间隔（毫秒）
              <input id="chunkDelay" type="number" min="0" max="300" value="15" />
            </label>
            <label>
              每 N 包做 ACK 校验
              <input id="ackEveryChunks" type="number" min="0" max="100" value="10" />
            </label>
            <label>
              ACK 特征值 UUID（可选）
              <input id="ackCharacteristicUuid" type="text" placeholder="0000ffe2-0000-1000-8000-00805f9b34fb" />
            </label>
            <label>
              ACK 期望十六进制（可选）
              <input id="ackExpectedHex" type="text" placeholder="aa55" />
            </label>
            <label>
              ACK 最大重试次数
              <input id="maxRetries" type="number" min="0" max="10" value="2" />
            </label>
          </div>
          <div class="actions top-space">
            <button id="connectBridgeBtn" type="button">连接桥接服务</button>
            <button id="sendBridgeBtn" type="button">发送当前画面（2-bit）</button>
          </div>
        </details>

        <div class="progress-wrap">
          <progress id="sendProgress" max="100" value="0"></progress>
          <span id="sendProgressText">0%</span>
        </div>

        <p id="bluetoothStatus" class="hint">尚未连接蓝牙发送通道。</p>
      </section>

      <section class="panel preview-wrap">
        <h2>SVG 预览</h2>
        <div id="previewFrame" class="preview-frame"></div>
        <details>
          <summary>查看 Atkinson 模拟预览（黑白红量化）</summary>
          <canvas id="ditherCanvas" width="400" height="300"></canvas>
        </details>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
